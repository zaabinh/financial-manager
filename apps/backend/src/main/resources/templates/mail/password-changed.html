<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your password was changed</title>
</head>
<body style="margin:0;background:#f4f6f8;font-family:Arial,sans-serif;color:#1f2937;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:24px;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0"
                   style="max-width:600px;background:#ffffff;border-radius:8px;padding:32px;">
                <tr>
                    <td>
                        <h1 style="margin-top:0;color:#1d4ed8;">Password changed</h1>
                        <p>Hello <strong th:text="${displayName}">there</strong>,</p>
                        <p>Your password was changed on <strong th:text="${changedAt}">the recorded date</strong>.</p>
                        <p>If you made this change, no further action is required.</p>
                        <div style="margin:24px 0;padding:16px;background:#fef2f2;border-left:4px solid #dc2626;">
                            If you did not change your password, secure your account immediately.
                        </div>
                        <p>
                            <a th:href="${securityUrl}" href="#"
                               style="background:#dc2626;color:#ffffff;padding:12px 20px;border-radius:6px;text-decoration:none;">
                                Secure my account
                            </a>
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
