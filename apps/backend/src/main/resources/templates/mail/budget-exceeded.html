<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly budget exceeded</title>
</head>
<body style="margin:0;background:#f4f6f8;font-family:Arial,sans-serif;color:#1f2937;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:24px;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0"
                   style="max-width:600px;background:#ffffff;border-radius:8px;padding:32px;">
                <tr>
                    <td>
                        <h1 style="margin-top:0;color:#b91c1c;">Budget exceeded</h1>
                        <p>Hello <strong th:text="${displayName}">there</strong>,</p>
                        <p>Your <strong th:text="${categoryName}">category</strong> spending has exceeded
                            this month's budget.</p>
                        <table role="presentation" width="100%" cellspacing="0" cellpadding="8"
                               style="margin:20px 0;background:#fef2f2;border-radius:6px;">
                            <tr><td>Spent</td><td align="right" th:text="${spentAmount}">0 VND</td></tr>
                            <tr><td>Budget</td><td align="right" th:text="${budgetAmount}">0 VND</td></tr>
                            <tr><td>Over by</td><td align="right" th:text="${exceededAmount}">0 VND</td></tr>
                        </table>
                        <p>
                            <a th:href="${budgetUrl}" href="#"
                               style="background:#b91c1c;color:#ffffff;padding:12px 20px;border-radius:6px;text-decoration:none;">
                                Review spending
                            </a>
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
