<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Personal Finance Manager</title>
</head>
<body style="margin:0;background:#f4f6f8;font-family:Arial,sans-serif;color:#1f2937;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:24px;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0"
                   style="max-width:600px;background:#ffffff;border-radius:8px;padding:32px;">
                <tr>
                    <td>
                        <h1 style="margin-top:0;color:#166534;">Welcome!</h1>
                        <p>Hello <strong th:text="${displayName}">there</strong>,</p>
                        <p>Your Personal Finance Manager account is ready. You can now track accounts,
                            transactions, and monthly budgets in one place.</p>
                        <p style="margin:28px 0;">
                            <a th:href="${loginUrl}" href="#"
                               style="background:#166534;color:#ffffff;padding:12px 20px;border-radius:6px;text-decoration:none;">
                                Open Finance Manager
                            </a>
                        </p>
                        <p style="margin-bottom:0;color:#6b7280;font-size:14px;">Thanks for joining us.</p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
