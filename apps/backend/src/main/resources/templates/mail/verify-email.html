<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify your email</title>
</head>
<body style="margin:0;background:#faf8fa;font-family:Arial,sans-serif;color:#3b353e;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:24px;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0"
                   style="max-width:600px;background:#ffffff;border:1px solid #ece8ed;border-radius:16px;padding:32px;">
                <tr>
                    <td>
                        <p style="margin-top:0;color:#df7faa;font-size:12px;font-weight:700;letter-spacing:1px;">
                            FINTRACKVN
                        </p>
                        <h1 style="margin:0 0 20px;color:#3b353e;font-size:28px;">Verify your email</h1>
                        <p>Hello <strong th:text="${displayName}">there</strong>,</p>
                        <p>Confirm this email address to finish securing your Personal Finance Manager account.</p>
                        <p style="margin:28px 0;">
                            <a th:href="${verificationUrl}" href="#"
                               style="display:inline-block;background:#f2afcb;color:#3b353e;padding:12px 20px;border-radius:12px;text-decoration:none;font-weight:700;">
                                Verify email
                            </a>
                        </p>
                        <p style="color:#6b626e;font-size:14px;">
                            This link expires in <span th:text="${expirationHours}">24</span> hours.
                            If you did not create this account, you can ignore this message.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
