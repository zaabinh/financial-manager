spring:
  application:
    name: finance-manager-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: finance
        format_sql: true
  flyway:
    baseline-description: ${FLYWAY_BASELINE_DESCRIPTION:Existing db.sql schema}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${FLYWAY_BASELINE_VERSION:9}
    enabled: true
    create-schemas: true
    default-schema: finance
    locations: classpath:db/migration
    schemas: finance

server:
  port: ${SERVER_PORT:8080}

logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId:-none}]"
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.example.financemanager: ${LOG_LEVEL_APP:INFO}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    issuer: ${JWT_ISSUER:finance-manager-backend}
    audience: ${JWT_AUDIENCE:finance-manager-client}
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:PT15M}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:P7D}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
