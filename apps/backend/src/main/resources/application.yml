spring:
  application:
    name: finance-manager-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    database-platform: com.example.financemanager.shared.persistence.FinancePostgreSqlDialect
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: finance
        format_sql: true
  flyway:
    baseline-description: ${FLYWAY_BASELINE_DESCRIPTION:Existing db.sql schema}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${FLYWAY_BASELINE_VERSION:9}
    enabled: true
    create-schemas: true
    default-schema: finance
    locations: classpath:db/migration
    schemas: finance
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    test-connection: ${MAIL_TEST_CONNECTION:false}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${MAIL_TIMEOUT_MS:5000}
          writetimeout: ${MAIL_WRITE_TIMEOUT_MS:5000}

server:
  port: ${SERVER_PORT:8080}

logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId:-none}]"
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.example.financemanager: ${LOG_LEVEL_APP:INFO}

app:
  auth:
    email-verification:
      token-expiration: ${EMAIL_VERIFICATION_EXPIRATION:PT24H}
      client-public-url: ${CLIENT_PUBLIC_URL:http://localhost:8081}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}
  jwt:
    issuer: ${JWT_ISSUER:finance-manager-backend}
    audience: ${JWT_AUDIENCE:finance-manager-client}
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:PT15M}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:P7D}
  mail:
    from-address: ${MAIL_FROM_ADDRESS:no-reply@finance-manager.local}
    from-name: ${MAIL_FROM_NAME:Personal Finance Manager}

management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
