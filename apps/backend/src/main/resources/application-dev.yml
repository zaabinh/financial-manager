spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/finance_manager}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: ${JPA_SHOW_SQL:true}

logging:
  level:
    com.example.financemanager: DEBUG
